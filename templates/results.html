<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Results</title>

  <link rel="icon" href="../public/background/icon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../public/css/global.css">
  <link rel="stylesheet" href="../public/css/results.css">
</head>

<body>

  <div id="result-overlay">
    <div id="result-popup">

      <h1 id="result-message">Congratulations!</h1>

      <p id="result-summary">
        You matched
        <span id="matched-words">0</span>
        out of
        <span id="total-words">0</span>
        words.
      </p>

      <div id="score-display">Score: 0</div>

      <p id="try-again-message"></p>

      <button id="continue-btn" type="button">
        Continue
      </button>

    </div>
  </div>


  <div id="top-scores-container">

    <h2>Top 10 Scores</h2>

    <table id="top-scores-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Score</th>
          <th>Time</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>

    <button id="back-btn" class="redirect-button" type="button">
      Back to Home
    </button>

  </div>


  <script src="../public/js/results.js"></script>

</body>
</html>
